name: CI and Pages deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Unit tests render the authenticated app, which checks build-time
      # config; the publishable values are public identifiers (12.3).
      - name: Unit and component tests
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Template artifact sync check
        run: |
          npx tsx scripts/generate-template-artifacts.mjs
          git diff --exit-code supabase/templates supabase/migrations/20260829020000_template_artifact.sql

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Database integration tests (RLS, RPC, seed, PKCE auth)
        run: npm run test:integration

      # Supabase URL and publishable key are public identifiers, not secrets
      # (WEBAPP_SPEC.md §12.3). They are provided as repository variables and
      # injected here once the production Supabase project exists (Task 5+).
      - name: Verify production configuration
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node scripts/validate-deploy-env.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Production build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify Pages subpath build
        run: VITE_BASE_PATH="/${{ github.event.repository.name }}/" npm run verify:subpath

      - name: Scan built artifact for secrets and private data
        run: node scripts/scan-dist.mjs

      - name: Scan tracked repository files for secrets
        run: node scripts/scan-repo.mjs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Deployment requires the repository to have Pages enabled with the
    # "GitHub Actions" source. The maintainers configure this manually; until
    # then this job is skipped on forks without Pages.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
